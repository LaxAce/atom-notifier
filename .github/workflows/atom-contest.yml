name: Atom Contest Automation

on:
  workflow_dispatch:
    inputs:
      contest_url:
        description: "Contest URL to enter manually (skip auto-detection)"
        required: false
      dry_run:
        description: "Dry run (generate names but don't submit)"
        type: boolean
        default: false
      test_names:
        description: "Comma-separated test names to submit directly (skips OpenAI generation)"
        required: false
      liked_names:
        description: "Comma-separated names you consider high quality (used as style reference, not submitted)"
        required: false
      disliked_names:
        description: "Comma-separated names you dislike (AI will avoid this style/pattern)"
        required: false
      liked_words:
        description: "Comma-separated words/roots you want the AI to draw from (e.g. spark,prime,nova)"
        required: false
      disliked_words:
        description: "Comma-separated words/roots to avoid entirely (e.g. smart,hub,pro)"
        required: false

jobs:
  participate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Check for new contest (auto-detect)
        if: ${{ !inputs.contest_url }}
        id: detect
        env:
          CONTEST_COOKIES: ${{ secrets.CONTEST_COOKIES }}
          CONTEST_URL: ${{ secrets.CONTEST_URL }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_NAME: ${{ secrets.GIST_NAME }}
        run: npx tsx src/services/participate/detect-contest.ts

      - name: Run contest (manual URL)
        if: ${{ inputs.contest_url }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: ${{ secrets.RAPIDAPI_HOST }}
          DOMAIN_CHECKER_URL: ${{ secrets.DOMAIN_CHECKER_URL }}
          CONTEST_COOKIES: ${{ secrets.CONTEST_COOKIES }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY_RUN_FLAG="--dry-run"; fi
          TEST_NAMES_FLAG=""
          if [ -n "${{ inputs.test_names }}" ]; then TEST_NAMES_FLAG="--test-names=${{ inputs.test_names }}"; fi
          LIKED_NAMES_FLAG=""
          if [ -n "${{ inputs.liked_names }}" ]; then LIKED_NAMES_FLAG="--liked-names=${{ inputs.liked_names }}"; fi
          DISLIKED_NAMES_FLAG=""
          if [ -n "${{ inputs.disliked_names }}" ]; then DISLIKED_NAMES_FLAG="--disliked-names=${{ inputs.disliked_names }}"; fi
          LIKED_WORDS_FLAG=""
          if [ -n "${{ inputs.liked_words }}" ]; then LIKED_WORDS_FLAG="--liked-words=${{ inputs.liked_words }}"; fi
          DISLIKED_WORDS_FLAG=""
          if [ -n "${{ inputs.disliked_words }}" ]; then DISLIKED_WORDS_FLAG="--disliked-words=${{ inputs.disliked_words }}"; fi
          npx tsx src/services/participate/run-contest.ts "${{ inputs.contest_url }}" $DRY_RUN_FLAG $TEST_NAMES_FLAG $LIKED_NAMES_FLAG $DISLIKED_NAMES_FLAG $LIKED_WORDS_FLAG $DISLIKED_WORDS_FLAG

      - name: Run contest (auto-detected)
        if: ${{ !inputs.contest_url && steps.detect.outputs.IS_NEW == 'true' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: ${{ secrets.RAPIDAPI_HOST }}
          DOMAIN_CHECKER_URL: ${{ secrets.DOMAIN_CHECKER_URL }}
          CONTEST_COOKIES: ${{ secrets.CONTEST_COOKIES }}
        run: |
          LIKED_NAMES_FLAG=""
          if [ -n "${{ inputs.liked_names }}" ]; then LIKED_NAMES_FLAG="--liked-names=${{ inputs.liked_names }}"; fi
          DISLIKED_NAMES_FLAG=""
          if [ -n "${{ inputs.disliked_names }}" ]; then DISLIKED_NAMES_FLAG="--disliked-names=${{ inputs.disliked_names }}"; fi
          LIKED_WORDS_FLAG=""
          if [ -n "${{ inputs.liked_words }}" ]; then LIKED_WORDS_FLAG="--liked-words=${{ inputs.liked_words }}"; fi
          DISLIKED_WORDS_FLAG=""
          if [ -n "${{ inputs.disliked_words }}" ]; then DISLIKED_WORDS_FLAG="--disliked-words=${{ inputs.disliked_words }}"; fi
          npx tsx src/services/participate/run-contest.ts "${{ steps.detect.outputs.CONTEST_URL }}" $LIKED_NAMES_FLAG $DISLIKED_NAMES_FLAG $LIKED_WORDS_FLAG $DISLIKED_WORDS_FLAG

      - name: Skip — no new contest
        if: ${{ !inputs.contest_url && steps.detect.outputs.IS_NEW != 'true' }}
        run: echo "No new contest found. Skipping."

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contest-logs-${{ github.run_id }}
          path: src/services/participate/logs/
          retention-days: 30
          if-no-files-found: ignore
