name: Atom Contest Automation

on:
  workflow_dispatch:
    inputs:
      contest_url:
        description: "Contest URL to enter manually (skip auto-detection)"
        required: false
      dry_run:
        description: "Dry run (generate names but don't submit)"
        type: boolean
        default: false
      test_names:
        description: "Comma-separated test names to submit directly (skips OpenAI generation)"
        required: false
      liked_names:
        description: "Comma-separated names you consider high quality (used as style reference, not submitted)"
        required: false
      disliked_names:
        description: "Comma-separated names you dislike (AI will avoid this style/pattern)"
        required: false
      liked_words:
        description: "Comma-separated words/roots you want the AI to draw from (e.g. spark,prime,nova)"
        required: false
      disliked_words:
        description: "Comma-separated words/roots to avoid entirely (e.g. smart,hub,pro)"
        required: false
      submission_limit:
        description: "Total entries to submit (default 25). 70% AI, 30% premium capped at 5. E.g. 70 → 65 AI + 5 premium"
        required: false

jobs:
  participate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Check for new contest (auto-detect)
        if: ${{ !inputs.contest_url }}
        id: detect
        env:
          CONTEST_COOKIES: ${{ secrets.CONTEST_COOKIES }}
          CONTEST_URL: ${{ secrets.CONTEST_URL }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_NAME: ${{ secrets.GIST_NAME }}
        run: npx tsx src/services/participate/detect-contest.ts

      - name: Run contest (manual URL)
        if: ${{ inputs.contest_url }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: ${{ secrets.RAPIDAPI_HOST }}
          DOMAIN_CHECKER_URL: ${{ secrets.DOMAIN_CHECKER_URL }}
          CONTEST_COOKIES: ${{ secrets.CONTEST_COOKIES }}
        run: |
          ARGS=("${{ inputs.contest_url }}")
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS+=("--dry-run")
          [ -n "${{ inputs.test_names }}" ] && ARGS+=("--test-names=${{ inputs.test_names }}")
          [ -n "${{ inputs.liked_names }}" ] && ARGS+=("--liked-names=${{ inputs.liked_names }}")
          [ -n "${{ inputs.disliked_names }}" ] && ARGS+=("--disliked-names=${{ inputs.disliked_names }}")
          [ -n "${{ inputs.liked_words }}" ] && ARGS+=("--liked-words=${{ inputs.liked_words }}")
          [ -n "${{ inputs.disliked_words }}" ] && ARGS+=("--disliked-words=${{ inputs.disliked_words }}")
          [ -n "${{ inputs.submission_limit }}" ] && ARGS+=("--submission-limit=${{ inputs.submission_limit }}")
          npx tsx src/services/participate/run-contest.ts "${ARGS[@]}"

      - name: Run contest (auto-detected)
        if: ${{ !inputs.contest_url && steps.detect.outputs.IS_NEW == 'true' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: ${{ secrets.RAPIDAPI_HOST }}
          DOMAIN_CHECKER_URL: ${{ secrets.DOMAIN_CHECKER_URL }}
          CONTEST_COOKIES: ${{ secrets.CONTEST_COOKIES }}
        run: |
          ARGS=("${{ steps.detect.outputs.CONTEST_URL }}")
          [ -n "${{ inputs.liked_names }}" ] && ARGS+=("--liked-names=${{ inputs.liked_names }}")
          [ -n "${{ inputs.disliked_names }}" ] && ARGS+=("--disliked-names=${{ inputs.disliked_names }}")
          [ -n "${{ inputs.liked_words }}" ] && ARGS+=("--liked-words=${{ inputs.liked_words }}")
          [ -n "${{ inputs.disliked_words }}" ] && ARGS+=("--disliked-words=${{ inputs.disliked_words }}")
          [ -n "${{ inputs.submission_limit }}" ] && ARGS+=("--submission-limit=${{ inputs.submission_limit }}")
          npx tsx src/services/participate/run-contest.ts "${ARGS[@]}"

      - name: Skip — no new contest
        if: ${{ !inputs.contest_url && steps.detect.outputs.IS_NEW != 'true' }}
        run: echo "No new contest found. Skipping."

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contest-logs-${{ github.run_id }}
          path: src/services/participate/logs/
          retention-days: 30
          if-no-files-found: ignore
